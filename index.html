<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavefield — RF & Radar Wave Propagation Simulator</title>
  <link rel="stylesheet" href="web/styles.css">
</head>
<body>
  <header class="hud-bar">
    <div class="hud-brand">WAVEFIELD RF HUD</div>
    <div class="hud-telemetry">
      <span>Engine: <span id="telemetry-engine" class="badge badge-engine">Detecting...</span></span>
      <span>FPS: <strong id="telemetry-fps">0</strong></span>
      <span>Wavelength: <strong id="telemetry-wavelength">0.086 m</strong></span>
      <span>Probe: <strong id="telemetry-probe">-120 dBm</strong></span>
    </div>
  </header>
  <main class="app-layout">
    <aside class="sidebar">
      <div class="control-group">
        <label for="select-preset">Scene Preset</label>
        <select id="select-preset">
          <option value="urban-5g">Urban 5G Canyon (3.5 GHz)</option>
          <option value="indoor-wifi">Indoor Wi-Fi Floorplan (2.4 GHz)</option>
          <option value="fpv-drone">5.8 GHz FPV Drone Link</option>
          <option value="naval-radar">10 GHz X-Band Radar</option>
        </select>
      </div>
      <div class="control-group">
        <label for="select-brush">Action / Brush Tool</label>
        <select id="select-brush">
          <option value="move-tx">Move Transmitter (TX)</option>
          <option value="5">Metal / PEC Barrier</option>
          <option value="4">Concrete Wall</option>
          <option value="2">Glass Window</option>
          <option value="3">Foliage Cluster</option>
          <option value="0">Eraser (Free Space)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="slider-freq">Frequency: <span id="label-freq">3.50</span> GHz</label>
        <input type="range" id="slider-freq" min="1.0" max="12.0" step="0.1" value="3.5">
      </div>
      <div class="control-group">
        <label for="slider-elements">Array Elements: <span id="label-elements">4</span></label>
        <input type="range" id="slider-elements" min="1" max="8" step="1" value="4">
      </div>
      <div class="control-group">
        <label for="slider-steer">Beam Steering: <span id="label-steer">0</span>&deg;</label>
        <input type="range" id="slider-steer" min="-60" max="60" step="1" value="0">
      </div>
      <div class="control-group">
        <label for="select-view">View Mode</label>
        <select id="select-view">
          <option value="2d">2D Heatmap (dBm)</option>
          <option value="25d">2.5D Shaded Relief</option>
        </select>
      </div>
      <div class="button-row">
        <button id="btn-pause">Pause</button>
        <button id="btn-reset">Reset Field</button>
        <button id="btn-clear-walls">Clear Walls</button>
      </div>
    </aside>
    <div class="canvas-container">
      <canvas id="sim-canvas" width="320" height="240"></canvas>
    </div>
  </main>
  <script type="module" src="web/app.js"></script>
</body>
</html>
